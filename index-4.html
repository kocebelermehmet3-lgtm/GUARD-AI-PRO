<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>GUARD AI PRO</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
</head>
<body>
<main class="app">
  <header>
    <div>
      <div class="brand">GUARD AI PRO</div>
      <div class="sub">AI Kamera Güvenlik Sistemi</div>
    </div>
    <span id="status" class="status idle">HAZIR</span>
  </header>

  <section class="camera-card">
    <div class="video-wrap">
      <video id="camera" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="placeholder" class="placeholder">Kamera kapalı<br><small>Kamerayı başlatmak için aşağıdaki düğmeye bas</small></div>
    </div>
    <div class="controls">
      <button id="startBtn">📷 Kamerayı Başlat</button>
      <button id="stopBtn" class="secondary" disabled>⏹ Durdur</button>
    </div>
  </section>

  <section class="grid">
    <div class="panel"><span>Sistem</span><b id="systemState">Hazır</b></div>
    <div class="panel"><span>AI Modeli</span><b id="modelState">Yükleniyor…</b></div>
    <div class="panel"><span>Tespit</span><b id="detectCount">0</b></div>
    <div class="panel"><span>Son Olay</span><b id="lastEvent">—</b></div>
  </section>

  <section class="events">
    <div class="section-title">Olay Geçmişi <button id="clearBtn" class="tiny">Temizle</button></div>
    <div id="eventsList" class="events-list"><div class="empty">Henüz olay yok.</div></div>
  </section>

  <div id="notice" class="notice hidden"></div>
</main>
<script src="app.js"></script>
</body>
</html>
